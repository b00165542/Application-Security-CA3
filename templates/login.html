{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="narrow card padded">
    <h1>Login</h1>
    <p class="muted">For loyalty members, staff and administrators. Guests can order without logging in.</p>
    <form method="post" action="/auth/login" class="stacked">
        <input type="hidden" name="next" value="{{ next or '' }}">
        <label>Username
            <input type="text" name="username" value="{{ username or '' }}" required maxlength="32" autocomplete="username" autofocus>
        </label>
        <label>Password
            <input type="password" name="password" required maxlength="72" autocomplete="current-password">
        </label>
        <button type="submit" class="btn">Login</button>
    </form>
    <p>No account? <a href="/auth/register">Join the loyalty programme</a>.</p>
</div>
{% endblock %}
