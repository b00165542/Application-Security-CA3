# Gitleaks configuration - picked up automatically from the repo root.
# Uses the full default ruleset (AWS/GitHub/Stripe keys, private keys, JWTs,
# generic high-entropy secrets, ...) and adds project-specific allowlisting.

[extend]
useDefault = true

[allowlist]
description = "Paths that never contain real secrets"
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)__pycache__/''',
  '''\.db$''',
]

# To ignore a single confirmed false positive, add its fingerprint (printed in
# the scan output) to a .gitleaksignore file, or put `# gitleaks:allow` at the
# end of the offending line.
